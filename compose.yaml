# PostgreSQL 16 for the Wave 5 indexer/API.
# DATABASE_URL=postgres://interline:interline@127.0.0.1:5432/interline
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: interline
      POSTGRES_PASSWORD: interline
      POSTGRES_DB: interline
    ports:
      - "5432:5432"
    volumes:
      - interline_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interline -d interline"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  interline_pg:
