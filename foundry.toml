[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "./deployments" },
]
gas_reports = ["CreditLine", "BorrowerVault"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
